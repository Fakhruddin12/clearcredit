[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clearcredit"
version = "0.1.0"
description = "Leakage-aware multi-table credit risk decision-support research"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0", "numpy>=1.24", "scikit-learn>=1.3", "PyYAML>=6.0",
  "duckdb>=1.0", "joblib>=1.3", "lightgbm>=4.0", "xlrd>=2.0"
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4", "httpx>=0.27"]
catboost = ["catboost>=1.2"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
clearcredit = "clearcredit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
